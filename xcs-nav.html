<style>
/* Xclusive Navigation - Dark Green Theme (#2b421f) Enhanced */

:root {
  --xcs-bg-dark: #2b421f;
  --xcs-bg-dark-hover: #223519;
  --xcs-text-light: #FFFFFF;
  --xcs-text-sub: #D8E3D4;
  --xcs-teal: #00A389;
  --xcs-teal-hover: #008771;
  --xcs-border: rgba(255, 255, 255, 0.15);
  --xcs-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  --xcs-font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
}

/* Base Navigation Container */
.xcs-nav-wrap {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  background-color: var(--xcs-bg-dark);
  border-bottom: 1px solid var(--xcs-border);
  position: relative;
  z-index: 999;
  font-family: var(--xcs-font-main);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
}

.xcs-nav-wrap * {
  box-sizing: border-box;
}

/* Main Navbar Layout */
.xcs-nav {
  max-width: 1280px;
  margin: 0 auto;
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  position: relative;
}

/* Brand Logo & Heading Container */
.xcs-nav__brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none !important;
  color: var(--xcs-text-light);
  line-height: 1;
}

.xcs-nav__brand img {
  display: block;
  height: 42px;
  width: auto;
  object-fit: contain;
  transition: transform 0.2s ease;
}

.xcs-nav__brand:hover img {
  transform: scale(1.52);
}

/* Accessible Title adjacent to logo */
.xcs-nav__brand-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--xcs-text-light);
  margin: 0;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

/* Menu Links Structure */
.xcs-nav__menu {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 28px;
}

.xcs-nav__menu > li {
  position: relative;
}

/* Primary Nav Items */
.xcs-nav__link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 500;
  color: var(--xcs-text-light);
  text-decoration: none !important;
  padding: 8px 4px;
  transition: color 0.2s ease, opacity 0.2s ease;
  white-space: nowrap;
  position: relative;
}

.xcs-nav__link:hover,
.xcs-nav__link:focus-visible {
  color: var(--xcs-teal);
  outline: none;
}

.xcs-nav__link.is-active {
  color: var(--xcs-teal);
  font-weight: 600;
}

/* Animated Underline Effect for Primary Links */
@media (min-width: 1025px) {
  .xcs-nav__link:not(.xcs-nav__cta)::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 4px;
    right: 4px;
    height: 2px;
    background-color: var(--xcs-teal);
    border-radius: 2px;
    opacity: 0;
    transform: scaleX(0);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .xcs-nav__link:not(.xcs-nav__cta):hover::after {
    opacity: 1;
    transform: scaleX(1);
  }
}

/* Dropdown Arrow Icon */
.xcs-chev {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.xcs-chev svg {
  width: 13px;
  height: 13px;
  stroke: currentColor;
  stroke-width: 2.2px;
}

.xcs-has-dropdown:hover .xcs-chev,
.xcs-has-dropdown:focus-within .xcs-chev,
.xcs-has-dropdown.is-open .xcs-chev {
  transform: rotate(180deg);
}

/* CTA Pill Button (Get Care) */
.xcs-nav__cta {
  background-color: var(--xcs-teal) !important;
  color: #FFFFFF !important;
  font-weight: 600 !important;
  font-size: 15px !important;
  padding: 10px 22px !important;
  border-radius: 50px !important;
  transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease !important;
  box-shadow: 0 4px 14px rgba(0, 163, 137, 0.3);
  text-decoration: none !important;
  line-height: 1.2;
}

.xcs-nav__cta:hover,
.xcs-nav__cta:focus-visible {
  background-color: var(--xcs-teal-hover) !important;
  transform: translateY(-1.5px);
  box-shadow: 0 6px 18px rgba(0, 163, 137, 0.4);
}

/* Desktop Dropdown Styling & Animations */
.xcs-dropdown {
  display: block;
  visibility: hidden;
  opacity: 0;
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 220px;
  list-style: none;
  margin: 8px 0 0 0;
  padding: 8px;
  background-color: var(--xcs-bg-dark);
  border: 1px solid var(--xcs-border);
  border-radius: 10px;
  box-shadow: var(--xcs-shadow);
  z-index: 100;
  transform: translateY(10px);
  /* CLOSING: stay open 0.4s, then fade out slowly over 0.35s */
  transition:
    opacity 0.35s ease 0.4s,
    transform 0.35s ease 0.4s,
    visibility 0s linear 0.75s;
}

/* Invisible bridge across the 8px gap so the cursor doesn't "fall off" */
.xcs-dropdown::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: -12px;
  height: 12px;
}

.xcs-dropdown a {
  display: block;
  padding: 10px 16px;
  font-size: 14.5px;
  font-weight: 400;
  color: var(--xcs-text-light);
  border-radius: 6px;
  text-decoration: none !important;
  transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
}

.xcs-dropdown a:hover,
.xcs-dropdown a:focus-visible {
  background-color: rgba(255, 255, 255, 0.08);
  color: var(--xcs-teal);
  transform: translateX(3px);
  outline: none;
}

@media (min-width: 1025px) {
  .xcs-has-dropdown:hover > .xcs-dropdown,
  .xcs-has-dropdown:focus-within > .xcs-dropdown,
  .xcs-has-dropdown.is-open > .xcs-dropdown {
    visibility: visible;
    opacity: 1;
    transform: translateY(0);
    /* OPENING: no delay, quick 0.12s snap-in */
    transition:
      opacity 0.12s ease,
      transform 0.12s ease,
      visibility 0s;
  }
}

/* Mobile Trigger Switch */
.xcs-nav__toggle {
  position: absolute;
  left: -9999px;
  opacity: 0;
}

.xcs-nav__burger {
  display: none;
  cursor: pointer;
  padding: 8px;
  border-radius: 6px;
  user-select: none;
  transition: background-color 0.2s ease;
}

.xcs-nav__burger:hover,
.xcs-nav__burger:focus-visible {
  background-color: rgba(255, 255, 255, 0.1);
  outline: none;
}

.xcs-burger-icon {
  width: 24px;
  height: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.xcs-burger-icon span {
  display: block;
  height: 2px;
  width: 100%;
  background-color: var(--xcs-text-light);
  border-radius: 2px;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.xcs-nav__toggle:checked ~ .xcs-nav__burger .xcs-burger-icon span:nth-child(1) {
  transform: translateY(8px) rotate(45deg);
}

.xcs-nav__toggle:checked ~ .xcs-nav__burger .xcs-burger-icon span:nth-child(2) {
  opacity: 0;
}

.xcs-nav__toggle:checked ~ .xcs-nav__burger .xcs-burger-icon span:nth-child(3) {
  transform: translateY(-8px) rotate(-45deg);
}

/* Mobile & Tablet Drawer Layout (<= 1024px) */
@media (max-width: 1024px) {
  .xcs-nav {
    padding: 12px 20px;
  }

  .xcs-nav__brand-title {
    font-size: 1.05rem;
  }

  .xcs-nav__burger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .xcs-nav__menu {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    background-color: var(--xcs-bg-dark);
    border-bottom: 1px solid var(--xcs-border);
    box-shadow: 0 16px 30px rgba(0, 0, 0, 0.4);
    max-height: 85vh;
    overflow-y: auto;
    padding: 8px 0 20px 0;
  }

  .xcs-nav__toggle:checked ~ .xcs-nav__menu {
    display: flex;
  }

  .xcs-nav__menu > li {
    width: 100%;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .xcs-nav__menu > li:last-child {
    border-bottom: none;
  }

  .xcs-nav__link {
    width: 100%;
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 500;
    justify-content: space-between;
    color: var(--xcs-text-light);
    text-decoration: none !important;
  }

  .xcs-nav__cta {
    display: flex !important;
    width: calc(100% - 48px) !important;
    margin: 16px auto 4px auto !important;
    text-align: center !important;
    justify-content: center !important;
    border-radius: 50px !important;
  }

  /* Sub-Item Flattened Styles for Mobile */
  .xcs-nav__menu li[data-flatten-clone="true"] {
    border-bottom: none;
    background-color: rgba(0, 0, 0, 0.12);
  }

  .xcs-nav__menu li[data-flatten-clone="true"] a {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 12px 24px 12px 48px;
    font-size: 14.5px;
    font-weight: 400;
    color: var(--xcs-text-sub);
    background-color: transparent !important;
    text-decoration: none !important;
    border: none !important;
    box-shadow: none !important;
    transition: color 0.15s ease, padding-left 0.15s ease;
  }

  .xcs-nav__menu li[data-flatten-clone="true"] a::before {
    content: "↳";
    color: var(--xcs-teal);
    font-weight: 600;
    font-size: 15px;
    margin-right: 10px;
    line-height: 1;
  }

  .xcs-nav__menu li[data-flatten-clone="true"] a:hover,
  .xcs-nav__menu li[data-flatten-clone="true"] a:focus-visible {
    color: #FFFFFF !important;
    padding-left: 52px;
    text-decoration: none !important;
  }

  .xcs-dropdown {
    display: none !important;
  }
}
</style>

<script>
(function(){
  var MOBILE_BP = 1024;
  var nav = document.querySelector('.xcs-nav');
  if(!nav) return;

  var toggle = document.getElementById('xcs-nav-toggle');
  var burger = nav.querySelector('.xcs-nav__burger');
  var menu = document.getElementById('xcs-nav-menu');

  function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function $(sel, root){ return (root||document).querySelector(sel); }
  function isMobile(){ return window.innerWidth <= MOBILE_BP; }

  // Dynamic accessibility attribute sync for drawer
  if(toggle && burger) {
    toggle.addEventListener('change', function() {
      burger.setAttribute('aria-expanded', toggle.checked ? 'true' : 'false');
    });
  }

  // Keyboard accessibility for hamburger trigger
  if(burger && toggle){
    burger.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        toggle.checked = !toggle.checked;
        toggle.dispatchEvent(new Event('change'));
      }
    });
  }

  // Close mobile menu drawer on link interaction
  if(menu && toggle){
    menu.addEventListener('click', function(e){
      var a = e.target && e.target.closest && e.target.closest('a[href]');
      if(!a) return;
      if(a.closest('[data-dropdown="true"]') && a.getAttribute('href') === '#') return;
      if(isMobile()){
        toggle.checked = false;
        toggle.dispatchEvent(new Event('change'));
      }
    });
  }

  // Smooth mobile drawer dropdown flattening logic
  function flattenMobile(){
    if(!menu || menu.getAttribute('data-flattened') === 'true') return;

    $$('.xcs-has-dropdown', menu).forEach(function(parentLi){
      var submenu = $('.xcs-dropdown', parentLi);
      if(!submenu) return;

      var subLinks = $$('a[href]', submenu);
      var insertAfter = parentLi;

      subLinks.forEach(function(a){
        var li = document.createElement('li');
        li.setAttribute('data-flatten-clone', 'true');
        var cloneA = a.cloneNode(true);
        li.appendChild(cloneA);
        insertAfter.parentNode.insertBefore(li, insertAfter.nextSibling);
        insertAfter = li;
      });
    });

    menu.setAttribute('data-flattened', 'true');
  }

  function unflattenDesktop(){
    if(!menu) return;
    $$('[data-flatten-clone="true"]', menu).forEach(function(node){
      if(node.parentNode) node.parentNode.removeChild(node);
    });
    menu.removeAttribute('data-flattened');
  }

  function handleResize(){
    if(isMobile()){
      flattenMobile();
    } else {
      unflattenDesktop();
    }
  }

  handleResize();
  window.addEventListener('resize', handleResize);
})();
</script>
